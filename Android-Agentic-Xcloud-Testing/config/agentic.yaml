# ===========================================================================
#  agentic.yaml - the ONLY place behaviour is declared.
#
#  Design rule for this whole folder: no test knowledge in Python.
#  * WHAT to test          -> scenarios/*.yaml|md|txt (free text is fine)
#  * WHICH controls exist  -> ../config/controls.yaml (discovered at runtime)
#  * HOW agents behave     -> this file
#
#  Anything you can imagine wanting to change without a code review lives here.
#  Every value below is read through a `.get(key, default)`, so deleting a key
#  is safe - you get the documented default, not a KeyError.
# ===========================================================================

meta:
  version: 1
  description: "Multi-agent Android/xCloud test runner configuration"

# ---------------------------------------------------------------------------
# LLM PROVIDERS
# Resolved at runtime by agentic/llm.py. `active` picks a profile; each agent
# may override it (a cheap model routes, an expensive one does RCA).
#
# api_key_env names the ENV VAR - never put a key in this file.
# ---------------------------------------------------------------------------
llm:
  # Set to match the key present in .env (ANTHROPIC_API_KEY). Change this one
  # line to switch every agent to another provider, or override per run with
  # `--llm local` / `--llm openai`.
  active: "anthropic"

  profiles:
    openai:
      provider: "openai"           # -> langchain_openai.ChatOpenAI
      model: "gpt-4o-mini"
      temperature: 0.0             # tests must be reproducible
      api_key_env: "OPENAI_API_KEY"
      supports_vision: true

    openai_strong:
      provider: "openai"
      model: "gpt-4o"
      temperature: 0.1
      api_key_env: "OPENAI_API_KEY"
      supports_vision: true

    # Model IDs are account-specific and they DO change. If a run reports
    # `404 not_found_error: model: ...`, list what your key can actually see:
    #     python -c "import anthropic;[print(m.id) for m in anthropic.Anthropic().models.list().data]"
    # and put a real id here. Nothing in the code hardcodes a model name.
    anthropic:
      provider: "anthropic"
      model: "claude-sonnet-4-5-20250929"
      temperature: 0.0
      api_key_env: "ANTHROPIC_API_KEY"
      supports_vision: true

    anthropic_fast:
      # Cheaper, for the high-frequency per-step judgements where the question
      # is narrow ("did the screen change as expected?") rather than open-ended.
      provider: "anthropic"
      model: "claude-haiku-4-5-20251001"
      temperature: 0.0
      api_key_env: "ANTHROPIC_API_KEY"
      supports_vision: true

    gemini:
      provider: "google_genai"
      model: "gemini-2.0-flash"
      temperature: 0.0
      api_key_env: "GOOGLE_API_KEY"
      supports_vision: true

    local:
      provider: "ollama"           # no API key, good for CI
      model: "qwen2.5:14b-instruct"
      temperature: 0.0
      base_url: "http://localhost:11434"
      supports_vision: false

  # Per-agent overrides. Omit an agent and it uses `active`.
  #
  # The split is about where reasoning actually pays for itself. RCA gets the
  # strongest model because attributing a failure to the wrong LAYER sends a
  # human down the wrong path for an hour. The executor's per-step judgement is
  # narrow and runs on every step, so it takes the cheap one.
  agent_profiles:
    executor: "anthropic_fast"
    observer: "anthropic"          # must be a vision profile if vision.enabled
    rca: "anthropic"               # root cause is where reasoning pays off

# ---------------------------------------------------------------------------
# HARDWARE / TRANSPORT
# Paths are relative to THIS folder's parent, so the agentic layer never
# duplicates the control map - it imports the verified one.
# ---------------------------------------------------------------------------
hardware:
  controls_config: "../config/controls.yaml"
  pad_module_dir: "../host"        # where pad_link.py lives
  transport: null                  # null = the profile marked `default:`
  serial_port: null                # null = controls.yaml, then auto-detect
  dry_run: false                   # true = plan + reason, never touch the port

# ---------------------------------------------------------------------------
# ANDROID / ADB
# adb is OPTIONAL. Without it the run still works, but the ObserverAgent has no
# eyes and the DeviceAgent can only confirm the pad, not the phone's UI state.
# Every one of these is a HINT for discovery, never an assumption:
# DeviceAgent asks the phone what is installed and what is focused.
# ---------------------------------------------------------------------------
android:
  adb_path: "adb"                  # or an absolute path
  serial: null                     # null = the single attached device
  required: false                  # true = abort the run when adb is missing

  # xCloud is a PWA, NOT an installed app. There is no package to launch and
  # no activity to assert on: it is a page inside a browser (often installed
  # as a WebAPK, which is why the package name varies per device and per
  # install method). So we never name a package - we discover browsers on the
  # device and let the agents reason about what they find.
  pwa:
    url: "https://www.xbox.com/play"
    # Discovery hints only. DeviceAgent matches installed packages against
    # these substrings; add yours if you use a different browser. If none
    # match, the agents are told that and adapt - they do not crash.
    browser_hints: ["chrome", "edge", "firefox", "samsung", "brave", "opera"]
    # A WebAPK's package usually contains this marker. Used to REPORT what was
    # found, not to decide behaviour.
    webapk_marker: "webapk"
    launch_mode: "view_url"        # view_url | already_open | manual
    # After launching, how long to let the PWA settle before observing.
    settle_seconds: 6.0

# ---------------------------------------------------------------------------
# OBSERVATION (closing the "blind automation" loop)
# ---------------------------------------------------------------------------
vision:
  enabled: true
  screenshot_dir: "artifacts"
  # Ask the LLM to describe the screenshot. Requires a vision-capable profile.
  llm_screen_reading: true
  # Downscale before sending to the model: cheaper, and 720p is plenty to read
  # a menu. 0 = send the native resolution.
  max_width: 1280
  jpeg_quality: 70
  # Frame-diff sensitivity: fraction of changed pixels that counts as "the
  # screen reacted". Below this we treat the input as having had NO effect,
  # which is exactly the failure the parent project could not detect.
  motion_threshold: 0.01
  ocr:
    enabled: true                  # silently skipped if pytesseract is absent
    lang: "eng"

logs:
  # ---- TERMINAL OUTPUT (agentic/logbook.py) -------------------------------
  # A run can take five minutes and used to print nothing until it finished, so
  # a slow stream and a hung serial port looked identical. Every layer now
  # narrates itself: what was dispatched, every wait and WHY, both looks at the
  # screen with their change ratios, and each judgement as it is made.
  #
  #   debug   everything, including adb calls and per-frame notes
  #   info    the default: steps, actions, waits, observations, judgements
  #   warn    only problems
  #   error   only failures
  #   silent  nothing (the final report still prints)
  level: "info"
  # Mirror the terminal log to artifacts/<run_id>/run.log. Costs nothing and it
  # lands beside the screenshots it describes, which is what makes a failed run
  # re-readable a week later.
  file_enabled: true
  # ANSI colour on the console. null = auto-detect (off when piped or when
  # NO_COLOR is set); the file copy is never coloured.
  colour: null

  # ---- DEVICE LOGS -------------------------------------------------------
  # Captured around each step so the RCA agent has evidence, not guesses.
  logcat_enabled: true
  logcat_lines: 400

  # Tag filters are hints for RELEVANCE scoring, not a hard filter - we keep
  # the raw buffer too, because the interesting line is never in the list you
  # thought of in advance.
  interesting_patterns:
    - "xcloud"
    - "gamepad"
    - "input"
    - "usb"
    - "hid"
    - "webapk"
    - "chromium"
    - "ANR"
    - "FATAL"

# ---------------------------------------------------------------------------
# EXECUTION
# ---------------------------------------------------------------------------
execution:
  # plan     = follow the PlannerAgent's steps, observing after each
  # reactive = ReAct loop; the model picks the next tool from what it SEES.
  #            Slower and costlier, but it can recover from an unexpected UI.
  # adaptive = plan first, switch to reactive only when a step's expectation
  #            is not met. Best default.
  mode: "adaptive"
  max_steps: 60                    # hard stop; guards against loops
  max_reactive_iterations: 12
  step_timeout_seconds: 45.0
  # DEPRECATED, kept so an old config still runs. Superseded by execution.settle
  # below, which replaced this single number with a per-action-kind pair. It is
  # no longer read by the executor.
  observe_delay_seconds: 1.5
  # Release every control when a run ends, however it ends. Non-negotiable:
  # a crash mid-stick otherwise leaves the character walking into a wall.
  always_reset_on_exit: true

  # -------------------------------------------------------------------------
  # SETTLE - the wait after every action, and WHEN we look at the screen.
  #
  # Read by agentic/timing.py, which is the only place this project sleeps.
  #
  # WHY THERE ARE TWO NUMBERS PER ACTION
  # Run 20260817-105323 pressed the D-pad, the xCloud highlight moved (the frame
  # diff measured 3.257%), the highlight settled back, and THEN the harness took
  # its one screenshot - measured 0.074% - and reported FAIL. The evidence was
  # photographed out of existence. Its own RCA called this a harness defect at
  # 85% confidence and asked for a capture "immediately after nav_test, before
  # any wait".
  #
  # So each input is now followed by:
  #   glance  a short wait, then a look - catches a TRANSIENT reaction
  #   settle  the rest of the animation, then a second look - the stable state
  # A step counts as having reacted if EITHER frame moved.
  #
  # Cost: this doubles screenshots and vision-LLM calls on acting steps. Set
  # glance_enabled: false to go back to one look per step (and to accept that a
  # transient reaction will be missed again).
  # -------------------------------------------------------------------------
  settle:
    glance_enabled: true
    # Multiplies every glance and settle below. The one knob to turn when the
    # network is congested or the phone is slow - no need to edit each pair.
    scale: 1.0

    # A button press: the menu highlight moves almost at once, then settles.
    press:   { glance: 0.45, settle: 1.20 }
    hold:    { glance: 0.45, settle: 1.50 }
    # A macro is several inputs, so its reaction is longer and later.
    macro:   { glance: 0.60, settle: 2.00 }
    stick:   { glance: 0.45, settle: 1.20 }
    trigger: { glance: 0.45, settle: 1.20 }
    special: { glance: 0.60, settle: 2.00 }
    # A page load over the network, not an app start. Nothing to glance at for
    # the first second, so the glance is longer here than anywhere else.
    pwa:     { glance: 1.50, settle: 6.00 }
    reset:   { glance: 0.20, settle: 0.40 }
    # OBSERVE steps ARE the observation, so they need no glance.
    observe: { glance: 0.00, settle: 0.30 }
    # A WAIT step already carries its own duration; adding more would be
    # double-counting the delay the planner asked for.
    wait:    { glance: 0.00, settle: 0.00 }
    # Used for any action kind not named above.
    default: { glance: 0.45, settle: 1.50 }


# ---------------------------------------------------------------------------
# RETRY / SELF-HEALING
# ---------------------------------------------------------------------------
retry:
  max_replans: 2                   # RCA -> replan cycles before giving up
  # RCA classifies the cause; only these classes are worth another attempt.
  # A wiring fault is not going to fix itself on retry - stopping fast and
  # saying so is more useful than three identical failures.
  retryable_causes: ["timing", "flaky_ui", "network", "stream_latency"]

# ---------------------------------------------------------------------------
# REPORTING
# ---------------------------------------------------------------------------
report:
  output_dir: "reports"
  formats: ["json", "markdown", "html"]
  include_screenshots: true
  include_raw_logs: false          # true makes reports big but self-contained

  # Screenshots are EMBEDDED into the HTML as base64 data URIs, not linked.
  #
  # Linking was tried first and looked correct - the <img src="file:///..."> tags
  # were right and the PNGs were on disk - but the images rendered as nothing. A
  # `file://` subresource is blocked when the page is served over http, inside an
  # IDE webview, and anywhere the absolute path does not exist (an emailed report,
  # a PR, another machine). Embedding makes the .html a single self-contained
  # artefact that renders everywhere.
  #
  # The cost is file size, so the embedded copy is a downscaled JPEG thumbnail.
  # The full-resolution PNG stays in artifacts/ and is still hyperlinked, so
  # clicking a thumbnail opens the original.
  thumbnail_width: 360             # px; 0 = embed the full-size PNG (large)
  thumbnail_quality: 72            # JPEG quality for the embedded copy

  # Rendered by the ReporterAgent; unknown keys are ignored, so adding a
  # section here is safe even if a run has no data for it.
  sections:
    - "verdict"
    - "scenario"
    - "environment"
    - "steps"
    - "evidence"
    - "root_cause"
    - "recommendations"

# ---------------------------------------------------------------------------
# SAFETY - things the agents are forbidden to do, enforced in code, not prompt.
# A prompt is a request; the tool registry is a wall.
# ---------------------------------------------------------------------------
safety:
  allow_shell: false               # arbitrary `adb shell` for the LLM
  # Only used when allow_shell is true. Prefix-matched against the command.
  allowed_shell_prefixes:
    - "dumpsys "
    - "pm list "
    - "getprop"
    - "wm size"
    - "input keyevent"
  forbidden_controls: []           # e.g. ["guide"] if Home hijacks your device
  max_run_seconds: 900
