# ===========================================================================
#  agentic.yaml - the ONLY place behaviour is declared.
# ===========================================================================

meta:
  version: 1
  description: "Multi-agent Android/xCloud test runner configuration"

llm:
  active: "anthropic"
  profiles:
    openai:
      provider: "openai"
      model: "gpt-4o-mini"
      temperature: 0.0
      api_key_env: "OPENAI_API_KEY"
      supports_vision: true
    openai_strong:
      provider: "openai"
      model: "gpt-4o"
      temperature: 0.1
      api_key_env: "OPENAI_API_KEY"
      supports_vision: true
    anthropic:
      provider: "anthropic"
      model: "claude-sonnet-4-5-20250929"
      temperature: 0.0
      api_key_env: "ANTHROPIC_API_KEY"
      supports_vision: true
    anthropic_fast:
      provider: "anthropic"
      model: "claude-haiku-4-5-20251001"
      temperature: 0.0
      api_key_env: "ANTHROPIC_API_KEY"
      supports_vision: true
    gemini:
      provider: "google_genai"
      model: "gemini-2.0-flash"
      temperature: 0.0
      api_key_env: "GOOGLE_API_KEY"
      supports_vision: true
    local:
      provider: "ollama"
      model: "qwen2.5:14b-instruct"
      temperature: 0.0
      base_url: "http://localhost:11434"
      supports_vision: false
  agent_profiles:
    executor: "anthropic_fast"
    observer: "anthropic"
    rca: "anthropic"
    decision: "anthropic_fast"
    verifier: "anthropic_fast"

hardware:
  controls_config: "../config/controls.yaml"
  pad_module_dir: "../host"
  transport: null
  serial_port: null
  dry_run: false

# ---------------------------------------------------------------------------
# ANDROID / ADB
# Put the real device serial in the .env file as:
#     ANDROID_SERIAL=192.168.x.x:port
# agentic.yaml deliberately contains no device-specific serial.
# ---------------------------------------------------------------------------
android:
  adb_path: "adb"
  serial: "${ANDROID_SERIAL}"
  required: false
  pwa:
    url: "https://www.xbox.com/play"
    browser_hints: ["chrome", "edge", "firefox", "samsung", "brave", "opera"]
    webapk_marker: "webapk"
    launch_mode: "view_url"
    settle_seconds: 6.0

vision:
  enabled: true
  screenshot_dir: "artifacts"
  llm_screen_reading: true
  max_width: 1280
  jpeg_quality: 70
  motion_threshold: 0.01
  ocr:
    enabled: true
    lang: "eng"

logs:
  level: "info"
  file_enabled: true
  colour: null
  logcat_enabled: true
  logcat_lines: 400
  interesting_patterns:
    - "xcloud"
    - "gamepad"
    - "input"
    - "usb"
    - "hid"
    - "webapk"
    - "chromium"
    - "ANR"
    - "FATAL"

execution:
  mode: "closed_loop"
  max_steps: 60
  max_reactive_iterations: 12
  step_timeout_seconds: 45.0
  max_iterations: 28

  closed_loop:
    handshake:
      enabled: true
      max_attempts: 2
      guide_presses: 2
      verify: true

    max_recovery_attempts: 2
    max_blind_iterations: 3
    max_consecutive_navigation: 1
    search_nav_budget: 6
    search_y_attempts: 2
    search_reset_budget: 2

    # Launch watchdog. A real launch may spend several observations in the
    # fullscreen handoff, but an identical black screen must not consume the
    # entire run. The verifier/recovery path uses this budget to re-announce the
    # controller before escalating to RCA.
    fullscreen_transition:
      wait_seconds: 3.0
      max_repeats: 5

    confidence:
      act: 0.85
      reobserve: 0.60

    perception:
      fast_first: true
      vision_on_low_confidence: true

  observe_delay_seconds: 1.5
  always_reset_on_exit: true

  settle:
    glance_enabled: true
    scale: 1.0
    press:   { glance: 0.45, settle: 1.20 }
    hold:    { glance: 0.45, settle: 1.50 }
    macro:   { glance: 0.60, settle: 2.00 }
    stick:   { glance: 0.45, settle: 1.20 }
    trigger: { glance: 0.45, settle: 1.20 }
    special: { glance: 0.60, settle: 2.00 }
    pwa:     { glance: 1.50, settle: 6.00 }
    reset:   { glance: 0.20, settle: 0.40 }
    observe: { glance: 0.00, settle: 0.30 }
    wait:    { glance: 0.00, settle: 0.00 }
    default: { glance: 0.45, settle: 1.50 }

retry:
  max_replans: 2
  retryable_causes: ["timing", "flaky_ui", "network", "stream_latency"]

report:
  output_dir: "reports"
  formats: ["json", "markdown", "html"]
  include_screenshots: true
  include_raw_logs: false
  thumbnail_width: 360
  thumbnail_quality: 72
  sections:
    - "verdict"
    - "scenario"
    - "environment"
    - "steps"
    - "evidence"
    - "root_cause"
    - "recommendations"

safety:
  allow_shell: false
  allowed_shell_prefixes:
    - "dumpsys "
    - "pm list "
    - "getprop"
    - "wm size"
    - "input keyevent"
  forbidden_controls: []
  max_run_seconds: 900
