# Search-first launch case.
#
# The game title is supplied through the global runtime input token `$input`.
# Set XAT_RUNTIME_INPUT (or runtime.input in config) to choose another title.
# ADB text is a fixture for search only; all game selection and launch actions
# after the search remain physical gamepad HID actions.

id: minecraft_dungeons_launch
title: "Search for Minecraft Dungeons and reach its main menu"
tags: ["regression", "slow", "stream", "end_to_end", "search_first"]

intent: >-
  Open xCloud, use its search UI to find the requested game by name using the
  global `$input` value, select the matching result with the physical gamepad,
  launch it, and reach the game's own main menu. Do not hunt the library with
  Minecraft-specific D-pad navigation.

preconditions:
  - "The Leonardo is connected to the phone by USB-OTG and its ON LED is lit"
  - "ADB is reachable and the device permits input injection for the search fixture"
  - "The phone is unlocked and awake"
  - "xCloud is signed in and can access the requested game"
  - "XAT_RUNTIME_INPUT or runtime.input contains the requested game title"

input:
  token: "$input"
  operation: "play"
  default: "Minecraft Dungeons"
  description: "Game title to search for before controller-based selection"

search_strategy:
  - "Launch/open xCloud and wait for the page to stabilize"
  - "Observe before interacting so the agent knows whether the search control is available"
  - "Use the physical controller to open/focus the xCloud search field; do not use adb tap"
  - "Use ADB_TEXT with target `$input` once the search field is visibly focused"
  - "Verify that the requested text was accepted before continuing"
  - "Use physical D-pad/gamepad input to move from the search field to the result"
  - "Select the matching result with physical A"
  - "If the result opens a detail page, activate Play/Play now with physical A"
  - "If selection directly enters fullscreen/loading, do not press A again; wait and observe"

controller_policy:
  allowed_inputs: [a, b, x, y, up, down, left, right, guide, start, back]
  prohibited_inputs: [adb_tap, touchscreen_input, virtual_keyboard]
  rule: >-
    The controller is still the only actuator used for game selection and game
    launch. ADB text is permitted only as the search fixture because the HID
    controller cannot type a game title.

state_model:
  SEARCH_FIELD:
    description: "xCloud search field is focused and ready for text input"
  SEARCH_RESULTS:
    description: "Search results for the requested title are visible"
  GAME_FOCUSED:
    description: "The requested game result is visibly focused"
  GAME_DETAIL:
    description: "The requested game's detail page with Play/Play now is visible"
  FULLSCREEN_TRANSITION:
    description: "xCloud is handing the selected game into the stream"
  GAME_LOADING:
    description: "xCloud/Xbox is loading or connecting to the game"
  LIVE_GAME_STREAM:
    description: "Actual game video is visible"
  GAME_SPLASH:
    description: "Game startup/splash/press-any-button screen is visible"
  GAME_MAIN_MENU:
    description: "The game's own main menu is visible"
  QUEUE:
    description: "The game is waiting in an xCloud service queue"
  STREAM_ERROR:
    description: "Fatal xCloud/game streaming error"
  SESSION_EXPIRED:
    description: "Authentication/session has expired"
  UNKNOWN:
    description: "The current screen cannot be classified confidently"

acceptance_criteria:
  - "xCloud loads successfully"
  - "The search field is focused before ADB_TEXT is attempted"
  - "ADB_TEXT is accepted by the device; a SecurityException or permission denial is a BLOCKED prerequisite, not a controller failure"
  - "The requested `$input` title appears in the search UI/results"
  - "The matching result becomes focused using physical gamepad input"
  - "Pressing physical A on the focused result produces GAME_DETAIL, FULLSCREEN_TRANSITION, GAME_LOADING, LIVE_GAME_STREAM, or GAME_SPLASH"
  - "If GAME_DETAIL appears, physical A activates Play/Play now"
  - "FULLSCREEN_TRANSITION and GAME_LOADING are valid launch states, not failures"
  - "The stream reaches the game's startup state"
  - "The game's own main menu is reached and identifiable"
  - "No fatal stream/error/session dialog remains on screen"

notes: >-
  SEARCH-FIRST is intentionally preferred over library navigation. It is faster,
  avoids game-specific routes, and works across different xCloud library layouts.
  `$input` is a global runtime token, so the same scenario structure can be used
  for other titles without changing controller navigation code.
