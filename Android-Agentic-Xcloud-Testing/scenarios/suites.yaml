# Named test suites for xCloud on Android via the Arduino HID pad.

meta:
  version: 2
  description: "Test suites for xCloud on Android via the Arduino HID pad"

suites:
  smoke:
    description: "Fast controller health check"
    stop_on_failure: true
    cases:
      - cases/controller_detected.yaml

  controller:
    description: "Controller detection, controls and generic navigation"
    stop_on_failure: true
    cases:
      - cases/controller_detected.yaml
      - cases/every_control_responds.yaml
      - cases/navigate_library.md

  regression:
    description: "Full regression sweep including search-first game launch"
    stop_on_failure: false
    cases:
      - cases/controller_detected.yaml
      - cases/every_control_responds.yaml
      - cases/navigate_library.md
      - cases/pwa_loads.yaml
      - cases/stream_launch.yaml
      - cases/minecraft_dungeons_launch.yaml

  end_to_end:
    description: "Search for the requested game, launch it, and reach its main menu"
    stop_on_failure: true
    cases:
      - cases/controller_detected.yaml
      - cases/minecraft_dungeons_launch.yaml

  diagnostics:
    description: "Characterise the rig and application without a full game journey"
    stop_on_failure: false
    cases:
      - cases/pwa_loads.yaml
      - cases/controller_detected.yaml
